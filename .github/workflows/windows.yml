name: Windows telepito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python ellenorzes
        run: python -m py_compile main.py
      - name: EXE epites
        run: |
          python -m pip install pyinstaller==6.16.0
          pyinstaller --noconfirm --onefile --windowed --name AI_Gatterka_Szabadkez main.py
      - name: Inno Setup telepito
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Telepito build hiba' }
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Gatterka-Szabadkez-0.1
          path: |
            dist/AI_Gatterka_Szabadkez_Telepito_0.1.exe
            dist/AI_Gatterka_Szabadkez.exe
          if-no-files-found: error
